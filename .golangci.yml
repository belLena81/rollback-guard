version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - exhaustive
    - dupl
    - gocognit
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - mnd
    - nestif
    - nilerr
    - staticcheck
    - unparam
    - unused
    - usestdlibvars
  settings:
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 20
    errcheck:
      check-type-assertions: true
      check-blank: true
  exclusions:
    rules:
      # mnd holds the line where R2 named every default and bound: the
      # composition roots and internal/platform (config first). Seven literals
      # remain elsewhere (probe percentiles, two poll intervals, one default
      # window); widen this when R4-R6 name them.
      - linters:
          - mnd
        path-except: ^(cmd|internal/platform)/
      # The R4 ratchet (complexity, duplication, unused parameters) holds
      # production code. Table-driven tests and scenario fixtures are long
      # and repetitive by design.
      - linters:
          - dupl
          - gocognit
          - gocyclo
          - nestif
          - unparam
        path: _test\.go$

formatters:
  enable:
    - gofmt
