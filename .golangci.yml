version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - exhaustive
    - gocritic
    - govet
    - ineffassign
    - nilerr
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

formatters:
  enable:
    - gofmt
