version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - exhaustive
    - dupl
    - gocognit
    - contextcheck
    - gocritic
    - lll
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - intrange
    - mnd
    - modernize
    - nestif
    - nilerr
    - perfsprint
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
  settings:
    lll:
      line-length: 160
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 20
    errcheck:
      check-type-assertions: true
      check-blank: true
  exclusions:
    rules:
      # mnd holds the line where R2 named every default and bound: the
      # composition roots and internal/platform (config first). Seven literals
      # remain elsewhere (probe percentiles, two poll intervals, one default
      # window); widen this when R4-R6 name them.
      - linters:
          - mnd
        path-except: ^(cmd|internal/platform)/
      # Test fixtures carry fake credentials, loopback requests and repo-local
      # files on purpose (G101, G304, G704);
      # contextcheck cannot follow test helpers; table-driven fixtures are long (lll).
      - linters:
          - gosec
          - contextcheck
          - lll
        path: _test\.go$
      # The R4 ratchet (complexity, duplication, unused parameters) holds
      # production code. Table-driven tests and scenario fixtures are long
      # and repetitive by design.
      - linters:
          - dupl
          - gocognit
          - gocyclo
          - nestif
          - unparam
        path: _test\.go$

formatters:
  enable:
    - gofmt
