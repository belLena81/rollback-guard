name: Set up Go
description: >-
  Installs the exact Go toolchain named in go.mod (the toolchain directive, so
  the standard library carries the security fixes go.mod requires) with module
  and build caches. Run actions/checkout first.

runs:
  using: composite
  steps:
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum
