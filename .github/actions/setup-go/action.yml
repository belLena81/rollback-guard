name: Set up Go
description: >-
  Installs the newest patch release of the Go version named in go.mod (so the
  standard library carries current security fixes) with module and build caches.
  Run actions/checkout first.

runs:
  using: composite
  steps:
    - name: Read the Go version from go.mod
      id: version
      shell: bash
      run: |
        version="$(sed -n 's/^go \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' go.mod | head -n 1)"
        test -n "${version}" || { echo "no go directive in go.mod" >&2; exit 1; }
        echo "go=${version}" >> "${GITHUB_OUTPUT}"
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ steps.version.outputs.go }}
        cache: true
        cache-dependency-path: go.sum
