openapi: 3.1.0
info:
  title: Rollback Guardian Orchestrator API
  version: 0.2.0
  description: >-
    Every error response carries the Error body. Validation and not-found
    messages describe the client's input; every other class has a fixed
    message and never echoes internal error text.
paths:
  /v1/incidents:
    post:
      operationId: createIncident
      description: Requires the operator role.
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentRequest'
      responses:
        '202':
          description: Incident accepted and queued for asynchronous investigation
          headers:
            Location:
              description: Canonical incident summary URL
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >-
            A non-terminal incident already exists for this deployment target
            (error conflict).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/incidents/{incidentId}:
    get:
      operationId: getIncident
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Incident summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/incidents/{incidentId}/events:
    get:
      operationId: listIncidentEvents
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Ordered audit events
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/incidents/{incidentId}/approve:
    post:
      operationId: approveIncident
      description: Requires the administrator role.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: >-
            Approval processed: the rollback was executed and recovery
            verified. The summary's incident status is the outcome (resolved,
            or failed with the recorded execution or verification).
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/RollbackOutcomeUnknown' }
  /v1/incidents/{incidentId}/reject:
    post:
      operationId: rejectIncident
      description: Requires the operator role.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectionRequest'
      responses:
        '200':
          description: Incident rejected
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/incidents/{incidentId}/cancel:
    post:
      operationId: cancelIncident
      description: Requires the operator role.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Incident canceled
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/github/login:
    get:
      operationId: githubLogin
      description: >-
        Starts the GitHub OAuth authorization-code flow (state and PKCE).
        Redirects to GitHub and sets a short-lived HttpOnly state cookie.
      security: []
      responses:
        '302':
          description: Redirect to GitHub's authorization endpoint.
          headers:
            Location:
              description: GitHub authorization URL.
              schema: { type: string }
            Set-Cookie:
              description: Short-lived HttpOnly OAuth state cookie.
              schema: { type: string }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/github/callback:
    get:
      operationId: githubCallback
      description: >-
        Completes the OAuth flow, checks organization membership, and issues a
        session. The session cookie is set and the same token is returned once
        in the body for scripts; treat it as a secret. The OAuth state cookie
        is cleared on every outcome, and every response carries
        Cache-Control no-store.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Session issued.
          headers:
            Set-Cookie:
              description: HttpOnly session cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: >-
            The state cookie is missing, tampered with or expired, the state
            does not match, or GitHub rejected the code (error
            validation_failed, fixed message). Start the login again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >-
            The GitHub user is not a member of the allowed organization, or
            the user is disabled (error forbidden, fixed message). No session
            is issued and, for a non-member, no user is stored. A known user
            who has left the organization also loses every open session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            The GitHub login is still held by another account's stored login
            (after a rename on GitHub) (error conflict, fixed message).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': { $ref: '#/components/responses/InternalError' }
        '502':
          description: >-
            GitHub was unreachable, timed out or answered unusably (error
            bad_gateway, fixed message). The provider's response is never
            returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/logout:
    post:
      operationId: logout
      description: Revokes the caller's current session and clears the session cookie.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '204':
          description: Session revoked.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/me:
    get:
      operationId: getMe
      description: The authenticated actor and its current role.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/users/{userId}/role:
    patch:
      operationId: setUserRole
      description: >-
        Requires the administrator role. Applies from the target user's next
        request. Setting the current role is a no-op. Returns 409 when the
        change would leave no enabled administrator, including an
        administrator demoting themselves as the last one.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRoleRequest'
      responses:
        '200':
          description: Role updated; the target user's identity and new role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/users/{userId}/sessions:revoke:
    post:
      operationId: revokeUserSessions
      description: Requires the administrator role. Revokes every session of the user; effective on their next request.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: All open sessions of the user revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedSessions'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/users/{userId}/disable:
    post:
      operationId: disableUser
      description: >-
        Requires the administrator role. Disables the user and revokes every
        open session of theirs in the same transaction, so their next request
        is rejected with 401 and they cannot log in again until enabled.
        Disabling a disabled user is a no-op. Returns 409 when the change
        would leave no enabled administrator, including an administrator
        disabling themselves as the last one.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User disabled; the target user's summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/users/{userId}/enable:
    post:
      operationId: enableUser
      description: >-
        Requires the administrator role. Enables a disabled user; sessions
        revoked by the disable stay revoked, so the user logs in again.
        Enabling an enabled user is a no-op.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User enabled; the target user's summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /health/live:
    get:
      operationId: live
      security: []
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      operationId: ready
      security: []
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready
  /metrics:
    get:
      operationId: metrics
      security: []
      description: >-
        Prometheus metrics for this orchestrator process (per-process registry).
        Labels are bounded: route patterns, enum outcomes, and tool names only;
        incident IDs, keys, and hashes never appear. See docs/phase6-telemetry.md.
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
              example: |
                # TYPE rollback_guardian_incidents_total counter
                rollback_guardian_incidents_total 3
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rollback_guard_session
      description: Opaque session token issued by the OAuth callback (HttpOnly cookie).
    bearerAuth:
      type: http
      scheme: bearer
      description: The same opaque session token as `Authorization Bearer`.
  responses:
    BadRequest:
      description: >-
        The request is invalid (error validation_failed, message names the
        field) or the body is not exactly one JSON value without unknown
        fields (error invalid_json).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: >-
        No request actor, or the session is missing, expired, revoked or
        belongs to a disabled user (error unauthenticated).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: >-
        The actor's current role does not allow this action, or a non-human
        actor tried to decide an approval (error forbidden).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The incident, the user, or a resource it needs does not exist (error not_found).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: >-
        The request conflicts with the incident's state (error conflict):
        illegal transition, concurrent change, idempotency conflict, approval
        that does not match the current proposal or deployment, expired
        proposal or approval, a policy denial, or a role change that would
        leave no enabled administrator. The fixed message says which.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server failure (error internal_error); the cause is logged with the request ID, never returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RollbackOutcomeUnknown:
      description: >-
        Error rollback_outcome_unknown: the rollback request may or may not
        have reached the cluster, and reconciling it was not possible. Nothing
        was recorded as failed; the incident stays executing with its
        execution attempt pending. Retry the same approval (same actionId and
        proposalHash): it reuses the approval's idempotency key, so the
        rollback MCP's ledger applies the mutation at most once and the retry
        reconciles the attempt, then verifies recovery. Do not create a new
        incident or roll back by other means.
      headers:
        Retry-After:
          description: Seconds to wait before retrying the same approval.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      description: Actor id of the user, for example github:12345.
      schema:
        type: string
  schemas:
    Role:
      type: string
      enum: [viewer, operator, administrator]
    Me:
      type: object
      required: [actorId, login, role]
      additionalProperties: false
      properties:
        actorId: { type: string, description: 'For example github:12345.' }
        login: { type: string }
        role:
          $ref: '#/components/schemas/Role'
    UserSummary:
      type: object
      required: [actorId, login, role, disabled]
      additionalProperties: false
      properties:
        actorId: { type: string, description: 'For example github:12345.' }
        login: { type: string }
        role:
          $ref: '#/components/schemas/Role'
        disabled: { type: boolean }
    RevokedSessions:
      type: object
      required: [revoked]
      additionalProperties: false
      properties:
        revoked: { type: integer, minimum: 0, description: Number of open sessions revoked. }
    SetRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/Role'
    SessionResponse:
      type: object
      required: [token, expiresAt, actorId, login, role]
      additionalProperties: false
      properties:
        token: { type: string, description: Returned once; never stored in clear by the server. }
        expiresAt: { type: string, format: date-time }
        actorId: { type: string }
        login: { type: string }
        role:
          $ref: '#/components/schemas/Role'
    Error:
      type: object
      required: [error, message]
      additionalProperties: false
      properties:
        error:
          type: string
          description: Stable, machine-readable error code.
          enum: [validation_failed, invalid_json, unauthenticated, forbidden, not_found, conflict, rollback_outcome_unknown, internal_error, bad_gateway]
        message:
          type: string
          description: Human-readable message; fixed per code except for validation_failed and not_found.
        requestId:
          type: string
          description: The X-Request-Id of the request (or "local" when none was sent), for log correlation.
    Target:
      type: object
      required: [cluster, namespace, deployment, service]
      additionalProperties: false
      properties:
        cluster: { type: string }
        namespace: { type: string }
        deployment: { type: string }
        service: { type: string }
    Symptom:
      type: object
      required: [kind, observed, threshold, unit, startedAt]
      additionalProperties: false
      properties:
        kind: { type: string }
        observed: { type: number }
        threshold: { type: number }
        unit: { type: string }
        startedAt: { type: string, format: date-time }
    CreateIncidentRequest:
      type: object
      required: [target, symptom]
      additionalProperties: false
      properties:
        target:
          $ref: '#/components/schemas/Target'
        symptom:
          $ref: '#/components/schemas/Symptom'
    ApprovalRequest:
      type: object
      required: [actionId, proposalHash]
      additionalProperties: false
      properties:
        actionId: { type: string }
        proposalHash: { type: string }
    RejectionRequest:
      type: object
      required: [actionId, proposalHash, reason]
      additionalProperties: false
      properties:
        actionId: { type: string }
        proposalHash: { type: string }
        reason: { type: string }
    CancelRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string }
    IncidentSummary:
      type: object
      required: [incident]
      additionalProperties: true
      properties:
        incident:
          type: object
        investigation:
          $ref: '#/components/schemas/Investigation'
        conclusion:
          $ref: '#/components/schemas/InvestigationConclusion'
    Investigation:
      type: object
      required: [operationId, state, stage, attempts, createdAt, updatedAt]
      additionalProperties: false
      properties:
        operationId: { type: string }
        taskId: { type: string }
        contextId: { type: string }
        state:
          type: string
          enum: [queued, submitting, submitted, working, cancel_requested, completed, failed, canceled]
        stage:
          type: string
          enum: [queued, deployment, metrics, diagnosis, finalizing]
        attempts: { type: integer, minimum: 0 }
        failureCode: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    InvestigationConclusion:
      type: object
      additionalProperties: false
      required: [id, strategy, hypothesis, confidence, evidenceIds, recommendation, provenance, createdAt]
      properties:
        id: { type: string }
        strategy:
          type: string
          enum: [rules, llm, hybrid]
        hypothesis: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidenceIds:
          type: array
          items: { type: string }
        recommendation:
          type: string
          enum: [rollback, no_action]
        provenance:
          $ref: '#/components/schemas/DiagnosisProvenance'
        createdAt: { type: string, format: date-time }
    DiagnosisProvenance:
      type: object
      additionalProperties: false
      required: [requestedStrategy, model, promptVersion, inputTokens, outputTokens]
      properties:
        requestedStrategy:
          type: string
          enum: [rules, llm, hybrid]
        model: { type: string }
        promptVersion: { type: string }
        inputTokens: { type: integer, format: int64, minimum: 0 }
        outputTokens: { type: integer, format: int64, minimum: 0 }
        fallbackReason:
          type: string
          enum: [provider_error, provider_timeout, provider_refusal, invalid_output]
