openapi: 3.1.0
info:
  title: Rollback Guardian Orchestrator API
  version: 0.1.0
paths:
  /v1/incidents:
    post:
      operationId: createIncident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentRequest'
      responses:
        '202':
          description: Incident accepted and queued for asynchronous investigation
          headers:
            Location:
              description: Canonical incident summary URL
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentSummary'
  /v1/incidents/{incidentId}:
    get:
      operationId: getIncident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Incident summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentSummary'
  /v1/incidents/{incidentId}/events:
    get:
      operationId: listIncidentEvents
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Ordered audit events
  /v1/incidents/{incidentId}/approve:
    post:
      operationId: approveIncident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Incident approved, executed, and verified
  /v1/incidents/{incidentId}/reject:
    post:
      operationId: rejectIncident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectionRequest'
      responses:
        '200':
          description: Incident rejected
  /v1/incidents/{incidentId}/cancel:
    post:
      operationId: cancelIncident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Incident canceled
  /health/live:
    get:
      operationId: live
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      operationId: ready
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready
  /metrics:
    get:
      operationId: metrics
      description: >-
        Prometheus metrics for this orchestrator process (per-process registry).
        Labels are bounded: route patterns, enum outcomes, and tool names only;
        incident IDs, keys, and hashes never appear. See docs/phase6-telemetry.md.
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
              example: |
                # TYPE rollback_guardian_incidents_total counter
                rollback_guardian_incidents_total 3
components:
  parameters:
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Target:
      type: object
      required: [cluster, namespace, deployment, service]
      additionalProperties: false
      properties:
        cluster: { type: string }
        namespace: { type: string }
        deployment: { type: string }
        service: { type: string }
    Symptom:
      type: object
      required: [kind, observed, threshold, unit, startedAt]
      additionalProperties: false
      properties:
        kind: { type: string }
        observed: { type: number }
        threshold: { type: number }
        unit: { type: string }
        startedAt: { type: string, format: date-time }
    CreateIncidentRequest:
      type: object
      required: [target, symptom]
      additionalProperties: false
      properties:
        target:
          $ref: '#/components/schemas/Target'
        symptom:
          $ref: '#/components/schemas/Symptom'
    ApprovalRequest:
      type: object
      required: [actionId, proposalHash]
      additionalProperties: false
      properties:
        actionId: { type: string }
        proposalHash: { type: string }
    RejectionRequest:
      type: object
      required: [actionId, proposalHash, reason]
      additionalProperties: false
      properties:
        actionId: { type: string }
        proposalHash: { type: string }
        reason: { type: string }
    CancelRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string }
    IncidentSummary:
      type: object
      required: [incident]
      additionalProperties: true
      properties:
        incident:
          type: object
        investigation:
          $ref: '#/components/schemas/Investigation'
        conclusion:
          $ref: '#/components/schemas/InvestigationConclusion'
    Investigation:
      type: object
      required: [operationId, state, stage, attempts, createdAt, updatedAt]
      additionalProperties: false
      properties:
        operationId: { type: string }
        taskId: { type: string }
        contextId: { type: string }
        state:
          type: string
          enum: [queued, submitting, submitted, working, cancel_requested, completed, failed, canceled]
        stage:
          type: string
          enum: [queued, deployment, metrics, diagnosis, finalizing]
        attempts: { type: integer, minimum: 0 }
        failureCode: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    InvestigationConclusion:
      type: object
      additionalProperties: false
      required: [id, strategy, hypothesis, confidence, evidenceIds, recommendation, provenance, createdAt]
      properties:
        id: { type: string }
        strategy:
          type: string
          enum: [rules, llm, hybrid]
        hypothesis: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidenceIds:
          type: array
          items: { type: string }
        recommendation:
          type: string
          enum: [rollback, no_action]
        provenance:
          $ref: '#/components/schemas/DiagnosisProvenance'
        createdAt: { type: string, format: date-time }
    DiagnosisProvenance:
      type: object
      additionalProperties: false
      required: [requestedStrategy, model, promptVersion, inputTokens, outputTokens]
      properties:
        requestedStrategy:
          type: string
          enum: [rules, llm, hybrid]
        model: { type: string }
        promptVersion: { type: string }
        inputTokens: { type: integer, format: int64, minimum: 0 }
        outputTokens: { type: integer, format: int64, minimum: 0 }
        fallbackReason:
          type: string
          enum: [provider_error, provider_timeout, provider_refusal, invalid_output]
