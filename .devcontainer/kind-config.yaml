# kind cluster created inside the dind sidecar; the API server is reachable
# from the dev container as https://dind:6443.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rollback-guard
networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          certSANs: ["dind", "localhost", "127.0.0.1"]
